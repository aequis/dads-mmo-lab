<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Characters - WoW Admin</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
  <h1>WoW Admin</h1>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/accounts">Accounts</a>
    <a class="active" href="/characters">Characters</a>
    <a href="/playerbots">Playerbots</a>
    <a href="/playerbots/config">Config</a>
  </nav>
</header>

<main>
  <section>
    <h2>Characters</h2>
    <table>
      <thead><tr><th>Name</th><th>Account</th><th>Level</th><th>Class</th><th>Zone</th><th>Map</th><th>Money</th><th>Online</th></tr></thead>
      <tbody>
      <tr th:each="character : ${characters}">
        <td th:text="${character.name}">Name</td>
        <td th:text="${character.username}">Account</td>
        <td th:text="${character.level}">80</td>
        <td th:text="${classNames[character.class] ?: character.class}">Mage</td>
        <td th:text="${character.zone}">0</td>
        <td th:text="${character.map}">0</td>
        <td th:text="${character.money}">0</td>
        <td th:text="${character.online}">0</td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
